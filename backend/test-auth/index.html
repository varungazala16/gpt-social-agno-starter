<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test - SocialGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f5f5f5;
            display: none;
        }

        .response.show {
            display: block;
        }

        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .token-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            display: none;
        }

        .token-display.show {
            display: block;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status.authenticated {
            background: #d4edda;
            color: #155724;
        }

        .status.not-authenticated {
            background: #f8d7da;
            color: #721c24;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔐 Auth Test Dashboard</h1>
            <p style="color: #666; margin-bottom: 20px;">
                Test authentication endpoints for SocialGPT API
                <span id="authStatus" class="status not-authenticated">Not Authenticated</span>
            </p>
        </div>

        <!-- Signup -->
        <div class="card">
            <h2>📝 Sign Up</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="signupName">Name</label>
                    <input type="text" id="signupName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required placeholder="••••••••">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <div id="signupResponse" class="response"></div>
        </div>

        <!-- Login -->
        <div class="card">
            <h2>🔑 Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit">Login</button>
            </form>
            <div style="margin: 20px 0; text-align: center; color: #999;">— OR —</div>
            <button id="googleLoginBtn" style="background: #4285f4; width: 100%;">
                Sign in with Google
            </button>
            <div id="loginResponse" class="response"></div>
            <div id="tokenDisplay" class="token-display"></div>
        </div>

        <!-- Protected Route Test -->
        <div class="card">
            <h2>🛡️ Test Protected Route</h2>
            <p style="color: #666; margin-bottom: 20px;">Test accessing a protected endpoint with your token</p>
            <button id="testProtectedBtn">Test Protected Endpoint</button>
            <button id="getMeBtn">Get Current User (/me)</button>
            <button id="clearTokenBtn" style="background: #dc3545;">Clear Token</button>
            <div id="protectedResponse" class="response"></div>
        </div>

        <!-- Social Account Connections -->
        <div class="card">
            <h2>🔗 Social Account Connections</h2>
            <p style="color: #666; margin-bottom: 20px;">Connect your social media accounts (requires authentication)</p>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="connectTikTokBtn" style="background: #000;">Connect TikTok</button>
                <button id="connectInstagramBtn" style="background: #E4405F;">Connect Instagram</button>
                <button id="connectYouTubeBtn" style="background: #FF0000;">Connect YouTube</button>
            </div>

            <button id="listConnectionsBtn" style="background: #28a745;">List All Connections</button>

            <div id="connectionsResponse" class="response"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
