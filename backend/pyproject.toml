[tool.poetry]
name = "gpt-social-backend"
version = "0.1.0"
description = "FastAPI backend for GPT.social engagement orchestration"
authors = ["Scrollmark Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "*"}
uvicorn = {extras = ["standard"], version = "*"}
alembic = "*"
sqlalchemy = "*"
supabase = "*"
psycopg2-binary = "*"
psycopg = {extras = ["binary"], version = "*"}
asyncpg = "*"
greenlet = "*"
httpx = "*"
pydantic = "*"
pydantic-settings = "*"
sqlalchemy-utils = "*"
cryptography = "*"
agno = "^2.1.4"
openai = "^2.3.0"
anthropic = "^0.69.0"
sendgrid = "^6.12.5"
ag-ui-protocol = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "alembic.*",
    "pydantic_settings",
    "sqlalchemy.*",
    "sqlalchemy_utils.*",
]
ignore_missing_imports = true
